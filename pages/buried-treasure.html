<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buried Treasure Seed Generator, Latest Bedrock Version</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Generate Buried Treasure seeds for the latest version of Minecraft Bedrock Edition speedrunning. Free FSG seed generator for current game versions.">
  <meta name="keywords" content="buried treasure seed, minecraft treasure speedrun, bedrock buried treasure fsg, mcbe treasure seed generator">
  <meta name="author" content="ma_ehy">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://minecraft-fsg.com/pages/buried-treasure.html">

  <!-- Open Graph -->
  <meta property="og:title" content="Buried Treasure Seed Generator, Latest Bedrock Version">
  <meta property="og:description" content="Generate Buried Treasure seeds for the latest version of Minecraft Bedrock Edition speedrunning. Free FSG seed generator for current game versions.">
  <meta property="og:url" content="https://minecraft-fsg.com/pages/buried-treasure.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://minecraft-fsg.com/styles/images/bt-panorama.jpg">
  <meta property="og:site_name" content="MCBE FSG Generator">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Buried Treasure Seed Generator, Latest Bedrock Version">
  <meta name="twitter:description" content="Generate Buried Treasure seeds for the latest version of Minecraft Bedrock Edition speedrunning. Free FSG seed generator for current game versions.">
  <meta name="twitter:image" content="https://minecraft-fsg.com/styles/images/bt-panorama.jpg">
  <link rel="icon" type="image/x-icon" href="../styles/favicons/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body::before {
      background-image: url('../styles/images/bt-panorama.jpg');
    }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- Visually hidden H1 for SEO, matches title image -->
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">Buried Treasure Seed Generator</h1>

    <img src="../styles/images/buried-treasure.png" alt="Buried Treasure Title" class="title-image">
    <div class="container">
      <button class="blocky-btn" id="treasureSeedBtn">Generate Seed</button>
      <div class="seed-box" id="treasureSeedBox"></div>
      <div class="button-row" id="copyBtnRow" style="display: none;">
        <button class="blocky-btn copy-btn" id="copyBtn">Copy Seed</button>
      </div>
      <div class="cooldown-container" id="cooldownContainer" style="display: none;">
        <div class="cooldown-bar" id="cooldownBar"></div>
      </div>
      <div class="navigation-buttons">
        <a class="blocky-btn back-btn" href="../index.html">← Back</a>
        <a class="blocky-btn help-btn" href="help.html">Help</a>
      </div>
      <div class="packless-warning">Warning: this mode is still in beta. The seeds might not work as intended (bt should always be at 8 8).</div>
    </div>
    <div class="discord discord-page">
      <a href="https://discord.gg/Hngq5zYw3k" target="_blank" rel="noopener noreferrer">Join the Discord for any questions, feedback and info.</a>
    </div>
  </div>
</div>

<script>
    let treasureSeeds = [];
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxMxZ9zStBmy6ERJk1ne6_-zH8eOEce5ISf_wcWYmq2tHYhrwKmNSaYZ_LzDYEHQn3mIQ/exec';
    let cooldownActive = false;
    let cooldownTime = 10;

    async function logToGoogleSheet(seed, filterType) {
      try {
        const timestamp = new Date().toISOString();
        const data = {
          seed: seed,
          filterType: filterType,
          timestamp: timestamp,
          userAgent: navigator.userAgent,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };

        await fetch(GOOGLE_SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });
      } catch (error) {
        console.error('Error logging to Google Sheets:', error);
      }
    }

    async function loadSeeds() {
      try {
        const response = await fetch("../seeds/buried-treasure.json");
        const seedText = await response.text();
        treasureSeeds = JSON.parse(seedText.replace(/-?\d+/g, m => '"' + m + '"'));
        document.getElementById("treasureSeedBtn").disabled = false;
      } catch (err) {
        console.error("Error loading seeds:", err);
      }
    }

    function getRandomSeed(seedArray) {
      const idx = Math.floor(Math.random() * seedArray.length);
      return seedArray[idx];
    }

    function startCooldown() {
      cooldownActive = true;
      let timeLeft = cooldownTime;
      const btn = document.getElementById('treasureSeedBtn');
      const container = document.getElementById('cooldownContainer');
      const bar = document.getElementById('cooldownBar');

      btn.disabled = true;
      container.style.display = 'block';
      bar.style.width = '100%';

      const interval = setInterval(() => {
        timeLeft--;
        const percentage = (timeLeft / cooldownTime) * 100;
        bar.style.width = percentage + '%';

        if (timeLeft <= 0) {
          clearInterval(interval);
          btn.disabled = false;
          container.style.display = 'none';
          cooldownActive = false;
        }
      }, 1000);
    }

    document.getElementById('treasureSeedBtn').addEventListener('click', () => {
      if (!cooldownActive && treasureSeeds.length > 0) {
        const seedBox = document.getElementById('treasureSeedBox');
        const seed = getRandomSeed(treasureSeeds);
        seedBox.textContent = seed;
        seedBox.style.display = 'flex';
        document.getElementById('copyBtnRow').style.display = 'flex';
        logToGoogleSheet(seed, 'Buried Treasure');
        startCooldown();
      }
    });

    document.getElementById('treasureSeedBox').addEventListener('dblclick', () => {
      const box = document.getElementById('treasureSeedBox');
      const seed = box.textContent.trim();
      if (seed !== "" && seed !== "Seed copied!") {
        navigator.clipboard.writeText(seed).then(() => {
          box.textContent = "Seed copied!";
          setTimeout(() => {
            box.textContent = seed;
          }, 1500);
        }).catch(err => {
          console.error("Error in copy:", err);
        });
      }
    });

    document.addEventListener('click', (e) => {
      if (e.target && e.target.id === 'copyBtn') {
        const box = document.getElementById('treasureSeedBox');
        const seed = box.textContent.trim();
        if (seed !== "" && seed !== "Seed copied!") {
          navigator.clipboard.writeText(seed).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = "Copied!";
            setTimeout(() => {
              copyBtn.textContent = originalText;
            }, 1500);
          });
        }
      }
    });

    document.getElementById("treasureSeedBtn").disabled = true;
    loadSeeds();
  </script>
</body>
</html>
